<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <style>
      /*
       * iOS PWA — evitar el espacio blanco inferior al reanudar la app.
       *
       * TÉCNICA: min-height extendido + padding safe-area en html.
       * Cuando iOS mueve el documento hacia arriba para acomodar el notch,
       * el html es suficientemente alto para cubrir el hueco inferior.
       * overscroll-behavior:none detiene el rubber-band sin bloquear scroll interno.
       * El fondo blanco hace invisibles cualquier flash residual bajo el nav.
       */
      html {
        min-height: calc(100% + env(safe-area-inset-top));
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        background: #ffffff;
        background-attachment: fixed;
        overscroll-behavior: none;
      }
      body {
        margin: 0;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: auto;
      }
      #root {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
    </style>
    <script>
      // Síncrono: fija desde el primer pixel el color de fondo según la pantalla, para que no
      // haya un cambio de color (que los celulares animan como desvanecido) al montar React.
      //  - Inicio de SIMAC (sin sesión): guinda.   - Maíz: fondo verde oscuro.
      //  - Otras pantallas sin sesión: verde oscuro (como antes).
      try {
        var p = location.pathname.replace(/\/+$/, '') || '/';
        var token = localStorage.getItem('simac_token');
        var guinda = !token && (p === '/' || p === '/inicio');
        var maiz = p === '/bienvenida';
        var bg = guinda ? '#611232' : (!token || maiz) ? '#092213' : '';
        if (bg) document.documentElement.style.background = bg;
        window.__simacTema = guinda ? '#611232' : maiz ? '#092213' : null;
      } catch(e) {}
    </script>
    <meta name="theme-color" content="#1A5C38" />
    <script>if (window.__simacTema) document.querySelector('meta[name="theme-color"]').setAttribute('content', window.__simacTema);</script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SIMAC" />
    <link rel="icon" type="image/png" href="/icono.png" />
    <link rel="apple-touch-icon" href="/icono.png" />
    <link rel="preload" href="/fonts/Patria_Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/NotoSans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/NotoSans-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800;900&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />
    <title>SIMAC — Sistema de Información de Mercados Agrícolas y Consulta</title>
    <meta name="description" content="SIMAC: Sistema de Información de Mercados Agrícolas y Consulta. Secretaría de Agricultura y Desarrollo Rural." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
